id: summary
name: RDH summary tables
version: "1.0"
category: Reports
description: >-
  Builds the combined tables the Galaxy RDH workflows output (MLST,
  SISTR, ABRicate, QUAST, emmtyper, CheckM + depth, Bracken), the same way
  Galaxy's text steps do. Any table whose tool is switched off is skipped.
license: MIT
container: quay.io/biocontainers/python:3.12.12
scope: all_samples
resources: {cpus: 1, memory_gb: 1}
requirements: {memory_gb: 1}
files: [summarise.py]

inputs:
  mlst: {type: tsv, optional: true, description: mlst reports.}
  sistr: {type: tsv, optional: true, description: SISTR predictions.}
  abricate_bac: {type: tsv, optional: true, description: ABRicate NCBI reports (with header).}
  abricate_cdip: {type: tsv, optional: true, description: ABRicate VFDB reports (no header).}
  quast: {type: tsv, optional: true, description: QUAST report.}
  emmtyper: {type: tsv, optional: true, description: emmtyper reports.}
  checkm: {type: tsv, optional: true, description: CheckM results.}
  shovill_log: {type: log, optional: true, description: Shovill logs (sequencing depth).}
  bracken: {type: tsv, optional: true, description: Bracken abundance tables.}

outputs:
  tables: {type: tsv, path: "out/*.tsv", optional: true, description: The Galaxy-style output tables.}

settings: {}

version_command: python3 --version 2>&1 | sed 's/^Python //'

galaxy:
  # Galaxy's text and collection steps this tool stands in for: every tool that
  # is part of Galaxy itself (Cut, Join, Concatenate ...) and these Tool Shed ones
  folds:
    - bgruening/text_processing
    - bgruening/add_line_to_file
    - iuc/collection_element_identifiers
    - iuc/datamash_transpose
    - nml/collapse_collections
    - artbio/concatenate_multiple_datasets
    - mvdbeek/concatenate_multiple_datasets
    - mvdbeek/add_input_name_as_column
    - galaxyp/regex_find_replace
  # which step's output feeds each input, when Galaxy passes it through text steps
  sources:
    mlst: {tool: mlst, output: report}
    sistr: {tool: sistr, output: prediction}
    abricate_bac: {tool: abricate, output: report, settings: {noheader: false}}
    abricate_cdip: {tool: abricate, output: report, settings: {noheader: true}}
    quast: {tool: quast, output: report}
    emmtyper: {tool: emmtyper, output: report}
    checkm: {tool: checkm, output: results}
    shovill_log: {tool: shovill, output: log}
    bracken: {tool: bracken, output: abundance}
  step: {publish: summary}

command: |
  python3 "$TOOL_DIR/summarise.py" --in-dir . --out-dir out
