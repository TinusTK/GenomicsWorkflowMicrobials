id: kraken2
name: Kraken2
version: 2.1.3
category: Species identification
description: >-
  Assigns each read to a taxon using a k-mer database, giving a report of
  which species are in the sample (identity check and contamination screen).
homepage: https://github.com/DerrickWood/kraken2
license: MIT
citation: "Wood DE, Lu J, Langmead B. (2019) Improved metagenomic analysis with Kraken 2. Genome Biology 20:257."
container: quay.io/biocontainers/kraken2:2.1.3--pl5321h077b44d_4
scope: per_sample
resources: {cpus: 8, memory_gb: 10}
requirements:
  memory_gb: 9
  disk_gb_per_sample: 0.1
  note: The whole database is loaded into memory (Standard-8 needs about 8 GB, Standard-16 about 16 GB).
databases: [kraken2_standard_8]
# the Database setting picks another installed one in its place; the command keeps using $DB_kraken2_standard_8
database_setting: database

inputs:
  reads: {type: reads, description: Paired reads.}

outputs:
  report: {type: txt, path: "out/{sample}.kraken2.report.txt", description: Kraken2 report (reads per taxon).}

settings:
  database:
    label: Database
    type: select
    options: [kraken2_standard_8, kraken2_standard_16, kraken2_standard]
    option_labels:
      kraken2_standard_8: Standard-8 (8 GB memory)
      kraken2_standard_16: Standard-16 (16 GB memory)
      kraken2_standard: Standard, full size (100 GB memory)
    default: kraken2_standard_8
    description: Which Kraken2 database to use, of the ones installed on the Databases page. Bigger ones are a little more exact and need more memory. Use the same one in the Bracken step.
  confidence:
    label: Confidence threshold
    type: number
    default: 0.0
    description: 0 to 1. Higher values classify fewer reads but with more confidence.
  min_base_quality:
    label: Minimum base quality
    type: integer
    default: 0
    description: Bases below this quality are ignored when classifying.
  minimum_hit_groups:
    label: Minimum hit groups
    type: integer
    default: 2
    description: Number of overlapping k-mer hit groups needed to classify a read.
  quick:
    label: Quick mode
    type: boolean
    default: false
    description: Stop at the first database hit (faster, less accurate).

version_command: kraken2 --version 2>&1 | head -1 | sed 's/^Kraken version //'

galaxy:
  tool: iuc/kraken2/kraken2
  inputs: {"single_paired|input_pair": reads}
  outputs: {report_output: report}
  settings:
    confidence: confidence
    min_base_quality: min_base_quality
    minimum_hit_groups: minimum_hit_groups
    quick: quick

command: |
  args=()
  [ "$S_quick" = true ] && args+=(--quick)
  kraken2 \
      --threads "$CPUS" \
      --db "$DB_kraken2_standard_8" \
      --confidence "$S_confidence" \
      --minimum-base-quality "$S_min_base_quality" \
      --minimum-hit-groups "$S_minimum_hit_groups" \
      "${args[@]}" \
      --report "out/$SAMPLE.kraken2.report.txt" \
      --paired "$IN_reads_1" "$IN_reads_2" > /dev/null
  echo "database: $(basename "$DB_kraken2_standard_8")" >> .ntg_notes
