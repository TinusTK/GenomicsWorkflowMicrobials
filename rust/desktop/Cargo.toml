# The desktop app (Tauri): the GUI in its own window, plus starting the
# engine (`gwm serve`): directly on Mac/Linux, inside WSL on Windows.
# Kept outside the workspace: it needs each system's web view to build.
[package]
name = "gwm-desktop"
version = "2.0.7"
description = "Genomics Workflow Microbials"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tauri-plugin-updater = "2"

[profile.release]
strip = true
lto = true

# The system tray icon (closing the window keeps the app there). Not on Linux,
# where it needs a library many desktops don't have: closing quits instead.
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
