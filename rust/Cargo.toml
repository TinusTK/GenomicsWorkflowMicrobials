# Genomics Workflow Microbials v2: the Rust app.
# The Python app in app/ stays until this one passes the same test runs.
[workspace]
resolver = "2"
members = ["crates/gwm-core", "crates/gwm-engine", "crates/gwm-server", "crates/gwm-cli"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "MIT"
repository = "https://github.com/TinusTK/GenomicsWorkflowMicrobials"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
dirs = "6"
clap = { version = "4", features = ["derive"] }
gwm-core = { path = "crates/gwm-core" }
gwm-engine = { path = "crates/gwm-engine" }
gwm-server = { path = "crates/gwm-server" }
