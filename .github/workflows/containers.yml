# Builds the containers of the built-in tools that have no BioContainers image
# (containers/<name>/Dockerfile) and publishes them on GitHub's registry as
# ghcr.io/tinustk/gwm-<name>:<version>. A published version is never built
# over: change the version here and in the tool's tool.yml together.
name: Containers

on:
  push:
    branches: [main]
    paths: ["containers/**", ".github/workflows/containers.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shigella-typing
            version: 1.0.2
          - name: cdiphtheriae-typing
            version: 1.0.0-galaxy2
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already published?
        id: have
        run: |
          if docker manifest inspect "ghcr.io/tinustk/gwm-${{ matrix.name }}:${{ matrix.version }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.have.outputs.skip != 'true'
        with:
          context: containers/${{ matrix.name }}
          push: true
          tags: ghcr.io/tinustk/gwm-${{ matrix.name }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Genomics Workflow Microbials tool container: ${{ matrix.name }}
