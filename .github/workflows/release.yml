# Builds the installers when a v2 tag is pushed (v2.0.0, v2.0.0-rc.1, ...):
#   Windows: .exe (NSIS) and .msi   macOS: .dmg (Intel and Apple Silicon)
#   Linux:   .AppImage and .deb
# and attaches them to a GitHub release for that tag.
name: Release

on:
  push:
    tags: ["v2*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The engine for Windows runs inside WSL (Ubuntu), so it is a Linux program.
  # Built on an older Ubuntu so it runs on every supported Ubuntu.
  engine-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release -p gwm-cli
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: gwm-linux
          path: rust/target/release/gwm

  desktop:
    needs: engine-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/gui/package-lock.json
      - name: Linux packages for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: rust/gui

      - name: Engine (Windows: the Linux one, for WSL)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: gwm-linux
          path: rust/desktop/bin
      - if: runner.os == 'Windows'
        shell: bash
        run: mv rust/desktop/bin/gwm rust/desktop/bin/gwm-linux
      - name: Engine (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          cargo build --release -p gwm-cli
          mkdir -p desktop/bin && cp target/release/gwm desktop/bin/gwm
      - name: Engine (macOS, both chips)
        if: runner.os == 'macOS'
        working-directory: rust
        run: |
          cargo build --release -p gwm-cli --target aarch64-apple-darwin
          cargo build --release -p gwm-cli --target x86_64-apple-darwin
          mkdir -p desktop/bin
          lipo -create -output desktop/bin/gwm target/aarch64-apple-darwin/release/gwm target/x86_64-apple-darwin/release/gwm

      - name: Build the app and installers
        working-directory: rust/desktop
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ../gui/node_modules/.bin/tauri build --target universal-apple-darwin
          else
            ../gui/node_modules/.bin/tauri build
          fi

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            rust/desktop/target/release/bundle/nsis/*.exe
            rust/desktop/target/release/bundle/msi/*.msi
            rust/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust/desktop/target/release/bundle/appimage/*.AppImage
            rust/desktop/target/release/bundle/deb/*.deb
