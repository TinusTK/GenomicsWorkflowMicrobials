# Builds the installers when a v2 tag is pushed (v2.0.0, v2.0.0-rc.1, ...):
#   Windows: .exe (NSIS) and .msi   macOS: .dmg (Intel and Apple Silicon)
#   Linux:   .AppImage and .deb
# and attaches them to a GitHub release for that tag, with latest.json: the
# list an installed app reads to update itself.
name: Release

on:
  push:
    tags: ["v2*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The engine for Windows runs inside WSL (Ubuntu), so it is a Linux program.
  # Built on an older Ubuntu so it runs on every supported Ubuntu.
  engine-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release -p gwm-cli
        working-directory: rust
      - uses: actions/upload-artifact@v4
        with:
          name: gwm-linux
          path: rust/target/release/gwm

  desktop:
    needs: engine-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # the Mac app is signed and notarized by Apple once the APPLE_* secrets exist
      MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            rust/desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/gui/package-lock.json
      - name: Linux packages for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: rust/gui

      - name: Engine (Windows, the Linux one for WSL)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: gwm-linux
          path: rust/desktop/bin
      - if: runner.os == 'Windows'
        shell: bash
        run: mv rust/desktop/bin/gwm rust/desktop/bin/gwm-linux
      - name: Engine (Linux)
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          cargo build --release -p gwm-cli
          mkdir -p desktop/bin && cp target/release/gwm desktop/bin/gwm
      # Secrets: APPLE_CERTIFICATE (the Developer ID Application certificate, a
      # .p12 file as base64), APPLE_CERTIFICATE_PASSWORD, and an App Store
      # Connect key for notarizing: APPLE_API_KEY_P8 (the .p8 file's text),
      # APPLE_API_KEY_ID, APPLE_API_ISSUER. Without them the app is unsigned.
      - name: Signing certificate (macOS)
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          if [ -z "$IDENTITY" ]; then
            echo "APPLE_CERTIFICATE holds no Developer ID Application certificate"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey_$APPLE_API_KEY_ID.p8"
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/apple/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"

      - name: Engine (macOS, both chips)
        if: runner.os == 'macOS'
        working-directory: rust
        run: |
          cargo build --release -p gwm-cli --target aarch64-apple-darwin
          cargo build --release -p gwm-cli --target x86_64-apple-darwin
          mkdir -p desktop/bin
          lipo -create -output desktop/bin/gwm target/aarch64-apple-darwin/release/gwm target/x86_64-apple-darwin/release/gwm
          # Apple only notarizes an app whose every program is signed: the engine too
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" desktop/bin/gwm
          fi

      # Each installer gets a signature (a .sig file) made with the update key:
      # an installed app only updates itself from a file that carries it.
      - name: Build the app and installers
        working-directory: rust/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ../gui/node_modules/.bin/tauri build --target universal-apple-darwin
          else
            ../gui/node_modules/.bin/tauri build
          fi

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            rust/desktop/target/release/bundle/nsis/*.exe
            rust/desktop/target/release/bundle/msi/*.msi
            rust/desktop/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust/desktop/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            rust/desktop/target/release/bundle/appimage/*.AppImage
            rust/desktop/target/release/bundle/deb/*.deb

      - name: Keep the signatures for the update list
        uses: actions/upload-artifact@v4
        with:
          name: signatures-${{ runner.os }}
          path: rust/desktop/target/**/bundle/**/*.sig
          if-no-files-found: error

  # latest.json: what an installed app reads to update itself (which file for
  # which system, and its signature). Written once every installer is attached.
  update-list:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: signatures-*
          path: signatures
      - name: Write latest.json and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --json assets > assets.json
          node .github/update-index.mjs signatures "$GITHUB_REPOSITORY" "$TAG" assets.json latest.json
          gh release upload "$TAG" latest.json --clobber
